<!DOCTYPE html>
<head>
    <title>⍼</title>
    <link rel="icon" type="image/x-icon" href="assets/faviconHome.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
        .catppuccinFrappe {
            --background: #303446;
            --text: #c6d0f5;
            --hightlights: #ca9ee6;
        }
        .draculaMode {
            --background: #282a36;
            --text: #f8f8f2;
            --highlights: #BD93F9;
        }
        body {
            background-color:#24273a;
            color:#cad3f5;
            font-family:"Jetbrains mono", monospace;
            height: 100vh;
            margin: 0px;
            display: grid;
            place-items: center;
            transition: all 0.5s;
            .p {
                margin: 14px 0;
            }
        }
        main {
            margin-bottom: 100px;
        }
        .dracula-mode {
            background-color:#282a36;
            color:#f8f8f2;
        }
        .buttonBlock {
            left:0px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .buttonBlock:hover{
            padding-left:5px;
        }
        .buttonBlock:active {
            padding-left: 10px;
        }
        .colourButtons {
            padding: 2px 5px;
            border-radius:5px;
            line-height:1.7em;
            color:#363a4f;
            font-size:15px;
        }
        .colourButtons:hover {
            color:#24273a;
        }
    </style>
</head>

<body>
    <main>
        <p style="margin-top:14px; margin-bottom:14px;">hello james</p>
        <p id="clock" style="margin-top:14px; margin-bottom:18px; text-align:center;"></p>
        <p>
            <a class="buttonBlock" href="https://www.youtube.com" target="_blank"><span class="colourButtons" style="background-color:#ed8796;">youtube</span></a>
            <br><a class="buttonBlock" href="https://instagram.com" target="_blank"><span class="colourButtons" style="background-color:#c6a0f6;">insta</span></a>
            <br><a class="buttonBlock" href="https://reddit.com" target="_blank"><span class="colourButtons" style="background-color:#f5bde6;">reddit</span></a>
        </p>
    </main>
    <p id="eventNoti" style="position:absolute; top:5px; right:5px; font-size:0.75em; margin:0px; text-align:right;"></p>
    <!-- <button onclick="switchModes()" style="position:absolute; margin:0px; right:5px; bottom:5px;">switch theme</button> -->
    <script src="clock.js"></script>
</body>
